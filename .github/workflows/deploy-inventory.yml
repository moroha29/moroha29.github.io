#  The manager and the Mini App shop moved to the card repository in November
#  2026 and are published from its own Pages site at /card/. What is left here
#  is a redirect at each old address, for bookmarks and for any menu button
#  that has not been refreshed yet.
name: Publish the inventory redirects
on:
  push:
    branches: [main]
    paths: ['web-portfolio/public/card_manager/**', 'web-portfolio/public/card_shop/**', '.github/workflows/deploy-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {path: source}
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: published}
      - run: |
          rm -rf published/card_manager published/card_shop
          mkdir -p published/card_manager published/card_shop
          cp source/web-portfolio/public/card_manager/index.html published/card_manager/
          cp source/web-portfolio/public/card_shop/index.html published/card_shop/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: published}
      - uses: actions/deploy-pages@v4
        id: deployment
