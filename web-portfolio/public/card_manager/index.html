<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The inventory manager has moved</title>
<link rel="canonical" href="https://moroha29.github.io/card/card_manager/">
<!-- The script carries the query and the fragment across, which the meta
     refresh below cannot. A Mini App launch puts its signed initData in the
     fragment, so a stale menu button that still opens this address has to
     arrive at the new one with that fragment intact. The meta refresh is the
     fallback for a browser running no script, a second behind so the script
     wins whenever there is one. -->
<script>location.replace("https://moroha29.github.io/card/card_manager/"+location.search+location.hash);</script>
<meta http-equiv="refresh" content="1; url=https://moroha29.github.io/card/card_manager/">
<style>body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:48px 20px;text-align:center}a{color:#376c44}</style>
</head><body><p>The inventory manager has moved to <a href="https://moroha29.github.io/card/card_manager/">https://moroha29.github.io/card/card_manager/</a>.</p></body></html>
